name: Job Logs Carrier Probe
description: Upload and inspect a controlled GitHub Actions job log
inputs:
  mode:
    description: upload or read
    required: true
  target-job-id:
    description: Numeric job id to inspect in read mode
    required: false
outputs:
  job-id:
    description: Numeric GitHub job id uploaded by the action
runs:
  using: node24
  main: index.js

