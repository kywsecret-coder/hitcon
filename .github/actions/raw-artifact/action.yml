name: Upload raw Repo Cassette carrier
description: Create an unarchived Actions artifact for a controlled MIME probe
inputs:
  path:
    description: File to upload
    required: true
  mime_type:
    description: Optional ArtifactService MIME metadata; empty omits the field
    required: false
  blob_mime_type:
    description: Optional MIME value on the raw Azure blob upload
    required: false
  version:
    description: Artifact protocol version (defaults to 7)
    required: false
  mime_type_alias:
    description: Second raw JSON mime_type key for parser behavior probe
    required: false
runs:
  using: node24
  main: index.js
