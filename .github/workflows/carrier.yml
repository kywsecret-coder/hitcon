name: Repo Cassette carrier

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read

jobs:
  carrier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the archived repository-shaped JSON
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          payload = {
              "full_name": "cassette/raw-payload",
              "owner": {
                  "login": "cassette",
                  "avatar_url": "file:///proc/self/environ",
              },
              "description": "Repo Cassette nested protobuf candidate",
              "stargazers_count": 0,
          }
          with open("carrier.json", "wb") as stream:
              stream.write(json.dumps(payload, separators=(",", ":")).encode())
          PY
      - name: Upload raw JSON with a MIME casing differential
        id: carrier
        uses: ./.github/actions/raw-artifact
        with:
          path: carrier.json
      - name: Print artifact identifier
        env:
          ARTIFACT_ID: ${{ steps.carrier.outputs.artifact-id }}
        run: printf 'ARTIFACT_ID=%s\n' "$ARTIFACT_ID"
      - name: Inspect API artifact response MIME
        env:
          ARTIFACT_ID: ${{ steps.carrier.outputs.artifact-id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import { createHash } from 'node:crypto';
          const url = 'https://api.github.com/repos/' + process.env.GITHUB_REPOSITORY +
            '/actions/artifacts/' + process.env.ARTIFACT_ID + '/zip';
          const response = await fetch(url, { headers: {
            accept: 'application/vnd.github.v3+json',
            authorization: 'Bearer ' + process.env.GH_TOKEN,
          }});
          const type = response.headers.get('content-type') || '';
          const body = Buffer.from(await response.arrayBuffer());
          let payload;
          try { payload = JSON.parse(body.toString('utf8')); } catch {}
          console.log('ZIP_STATUS=' + response.status);
          console.log('ZIP_CONTENT_TYPE=' + JSON.stringify(type));
          console.log('ZIP_CONTENT_TYPE_CODEPOINTS=' + Array.from(type, c => c.codePointAt(0).toString(16)).join(','));
          console.log('ZIP_BODY_BYTES=' + body.length);
          console.log('ZIP_BODY_FULL_NAME=' + (payload?.full_name || ''));
          console.log('ZIP_BODY_SHA256=' + createHash('sha256').update(body).digest('hex'));
          JS
