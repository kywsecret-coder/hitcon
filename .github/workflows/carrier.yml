name: Repo Cassette inspect and clean artifacts

on:
  push:
    branches:
      - codex/repo-cassette-release-routes

permissions:
  actions: write
  contents: read

jobs:
  inspect-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect exact artifact response headers and clean probes
        uses: actions/github-script@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const https = require('https');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const artifactId = '12590687349';
            const start = new URL('https://api.github.com/repos/' + owner + '/' + repo +
              '/actions/artifacts/' + artifactId + '/zip');
            function contentTypes(raw) {
              const result = [];
              for (let i = 0; i < raw.length; i += 2) {
                if (String(raw[i]).toLowerCase() === 'content-type') result.push(raw[i + 1]);
              }
              return result;
            }
            function request(target, headers) {
              return new Promise((resolve, reject) => {
                https.get(target, {headers}, response => {
                  const chunks = [];
                  response.on('data', chunk => chunks.push(chunk));
                  response.on('end', () => resolve({
                    status: response.statusCode || 0,
                    headers: response.headers,
                    rawHeaders: response.rawHeaders,
                    body: Buffer.concat(chunks),
                  }));
                }).on('error', reject);
              });
            }
            let current = start;
            for (let hop = 0; hop < 6; hop++) {
              const headers = {
                accept: 'application/vnd.github.v3+json',
                'user-agent': 'repo-cassette-probe',
                'x-github-api-version': '2022-11-28',
              };
              if (current.hostname === 'api.github.com') {
                headers.authorization = 'Bearer ' + process.env.GITHUB_TOKEN;
              }
              const response = await request(current, headers);
              console.log('ARTIFACT_HOP status=' + response.status +
                ' host=' + current.host +
                ' content_types=' + JSON.stringify(contentTypes(response.rawHeaders)));
              if (response.status >= 300 && response.status < 400 && response.headers.location) {
                current = new URL(response.headers.location, current);
                continue;
              }
              break;
            }
            const result = await github.rest.actions.listArtifactsForRepo({owner, repo, per_page: 100});
            const mine = result.data.artifacts.filter(artifact =>
              artifact.workflow_run?.head_branch === 'codex/repo-cassette-release-routes');
            let deleted = 0;
            for (const artifact of mine) {
              await github.rest.actions.deleteArtifact({owner, repo, artifact_id: artifact.id});
              deleted++;
            }
            console.log('PROBE_ARTIFACTS_DELETED=' + deleted);
