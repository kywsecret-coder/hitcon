name: Repo Cassette carrier

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read

jobs:
  carrier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the archived repository-shaped JSON
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          payload = {
              "full_name": "cassette/raw-payload",
              "owner": {
                  "login": "cassette",
                  "avatar_url": "file:///proc/self/environ",
              },
              "description": "Repo Cassette nested protobuf candidate",
              "stargazers_count": 0,
          }
          with open("carrier.json", "wb") as stream:
              stream.write(json.dumps(payload, separators=(",", ":")).encode())
          PY
      - name: Upload raw JSON with a leading-NEL artifact MIME
        id: carrier
        uses: ./.github/actions/raw-artifact
        with:
          path: carrier.json
      - name: Print artifact identifier
        env:
          ARTIFACT_ID: ${{ steps.carrier.outputs.artifact-id }}
        run: printf 'ARTIFACT_ID=%s\n' "$ARTIFACT_ID"
      - name: Inspect the public artifact response headers
        env:
          ARTIFACT_ID: ${{ steps.carrier.outputs.artifact-id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import { createHash } from 'node:crypto';
          const root = 'https://api.github.com/repos/' + process.env.GITHUB_REPOSITORY;
          const artifact = root + '/actions/artifacts/' + process.env.ARTIFACT_ID;
          const routes = [
            ['zip', artifact + '/zip'],
            ['zip_download', artifact + '/zip/download'],
            ['download', artifact + '/download'],
            ['raw', artifact + '/raw'],
            ['metadata', artifact],
            ['run_artifact', root + '/actions/runs/' + process.env.GITHUB_RUN_ID +
              '/artifacts/' + process.env.ARTIFACT_ID],
            ['run_artifact_zip', root + '/actions/runs/' + process.env.GITHUB_RUN_ID +
              '/artifacts/' + process.env.ARTIFACT_ID + '/zip'],
          ];
          for (const [label, url] of routes) {
            const response = await fetch(url, {
              headers: {
                accept: 'application/vnd.github.v3+json',
                authorization: 'Bearer ' + process.env.GH_TOKEN,
              },
            });
            const contentType = response.headers.get('content-type') || '';
            const bytes = Buffer.from(await response.arrayBuffer());
            let payload;
            try { payload = JSON.parse(bytes.toString('utf8')); } catch {}
            console.log(label + '_STATUS=' + response.status);
            console.log(label + '_CONTENT_TYPE=' + JSON.stringify(contentType));
            console.log(label + '_CONTENT_TYPE_CODEPOINTS=' +
              Array.from(contentType, c => c.codePointAt(0).toString(16)).join(','));
            console.log(label + '_BODY_BYTES=' + bytes.length);
            console.log(label + '_BODY_SHA256=' + createHash('sha256').update(bytes).digest('hex'));
            console.log(label + '_BODY_FULL_NAME=' + (payload?.full_name || ''));
          }
          const releaseRoutes = [
            ['release_asset', 'https://api.github.com/repos/neovim/neovim/releases/assets/625399210'],
            ['release_asset_raw', 'https://api.github.com/repos/neovim/neovim/releases/assets/625399210?raw=1'],
            ['release_asset_download', 'https://api.github.com/repos/neovim/neovim/releases/assets/625399210?download=1'],
            ['release_asset_named', 'https://api.github.com/repos/neovim/neovim/releases/download/v0.12.6/nvim-linux-arm64.appimage'],
          ];
          for (const [label, url] of releaseRoutes) {
            const response = await fetch(url, {
              headers: { accept: 'application/vnd.github.v3+json' },
            });
            const contentType = response.headers.get('content-type') || '';
            const length = response.headers.get('content-length') || '';
            const reader = response.body?.getReader();
            const first = reader ? await reader.read() : { value: new Uint8Array() };
            const prefix = Buffer.from(first.value || []).subarray(0, 16);
            if (reader) await reader.cancel();
            console.log(label + '_STATUS=' + response.status);
            console.log(label + '_CONTENT_TYPE=' + JSON.stringify(contentType));
            console.log(label + '_LENGTH=' + length);
            console.log(label + '_PREFIX_HEX=' + prefix.toString('hex'));
          }
          JS

