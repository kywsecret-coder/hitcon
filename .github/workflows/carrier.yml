name: Repo Cassette job log MIME probe

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read

jobs:
  uploader:
    runs-on: ubuntu-latest
    outputs:
      job-id: ${{ steps.carrier.outputs.job-id }}
    steps:
      - uses: actions/checkout@v4
      - name: Upload a raw job log and set its blob MIME
        id: carrier
        uses: ./.github/actions/joblogs-carrier
        with:
          mode: upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  inspector:
    needs: uploader
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read uploaded log response headers
        uses: ./.github/actions/joblogs-carrier
        with:
          mode: read
          target-job-id: ${{ needs.uploader.outputs.job-id }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

