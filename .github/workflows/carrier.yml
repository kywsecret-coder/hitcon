name: Repo Cassette job log MIME probe

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read

jobs:
  carrier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload a raw job log and set its blob MIME
        uses: ./.github/actions/joblogs-carrier
        with:
          mode: upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

