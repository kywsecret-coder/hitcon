name: Repo Cassette raw artifact NEL MIME probe

on:
  push:
    branches: [codex/repo-cassette-carrier]

permissions:
  actions: read
  contents: read

jobs:
  carrier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare repository-shaped JSON
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          payload = {
              "full_name": "pending/pending",
              "owner": {"login": "cassette", "avatar_url": "file:///proc/self/environ"},
              "description": "Repo Cassette raw artifact NEL MIME probe",
              "stargazers_count": 0,
          }
          with open("carrier.json", "wb") as stream:
              stream.write(json.dumps(payload, separators=(",", ":")).encode())
          PY
      - name: Create unarchived JSON artifact with NEL MIME
        uses: ./.github/actions/raw-artifact
        with:
          path: carrier.json
          mime_type: "application/json\u0085"
