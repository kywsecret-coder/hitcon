name: Repo Cassette artifact v8 compatibility probe

on:
  push:
    branches:
      - codex/repo-cassette-release-routes

permissions:
  actions: write
  contents: read

jobs:
  artifact-v8:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare repository-shaped JSON
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          payload = {
              "full_name": "pending/pending",
              "owner": {"login": "cassette", "avatar_url": "file:///proc/self/environ"},
              "description": "Repo Cassette v8 compatibility probe",
              "stargazers_count": 0,
          }
          with open("carrier-v8.json", "wb") as stream:
              stream.write(json.dumps(payload, separators=(",", ":")).encode())
          PY
      - name: Upload v8 artifact with NEL MIME
        id: carrier
        continue-on-error: true
        uses: ./.github/actions/raw-artifact
        with:
          path: carrier-v8.json
          version: "8"
          mime_type: "application/json\u0085"
          blob_mime_type: "application/json\u0085"
      - name: Inspect v8 artifact response
        if: steps.carrier.outputs.artifact-id != ''
        uses: actions/github-script@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT_ID: ${{ steps.carrier.outputs.artifact-id }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const https = require('https');
            const {createHash} = require('crypto');
            const id = process.env.ARTIFACT_ID;
            const target = new URL('https://api.github.com/repos/' + context.repo.owner + '/' +
              context.repo.repo + '/actions/artifacts/' + id + '/zip');
            const headers = {
              accept: 'application/vnd.github.v3+json',
              authorization: 'Bearer ' + process.env.GITHUB_TOKEN,
              'user-agent': 'repo-cassette-probe',
              'x-github-api-version': '2022-11-28',
            };
            https.get(target, {headers}, response => {
              const chunks = [];
              response.on('data', chunk => chunks.push(chunk));
              response.on('end', () => {
                const body = Buffer.concat(chunks);
                console.log('V8_STATUS=' + response.statusCode);
                console.log('V8_CT=' + JSON.stringify(response.headers['content-type'] || ''));
                console.log('V8_BYTES=' + body.length);
                console.log('V8_SHA256=' + createHash('sha256').update(body).digest('hex'));
              });
            }).on('error', error => console.log('V8_PROBE_ERROR=' + error.message));
      - name: Remove probe artifacts from this branch
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const {owner, repo} = context.repo;
            const result = await github.rest.actions.listArtifactsForRepo({owner, repo, per_page: 100});
            const probeArtifacts = result.data.artifacts.filter(a =>
              a.workflow_run?.head_branch === 'codex/repo-cassette-release-routes');
            for (const artifact of probeArtifacts) {
              await github.rest.actions.deleteArtifact({owner, repo, artifact_id: artifact.id});
            }
            console.log('PROBE_ARTIFACTS_DELETED=' + probeArtifacts.length);
