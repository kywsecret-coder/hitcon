name: Repo Cassette encoded MIME probe

on:
  push:
    branches:
      - codex/repo-cassette-release-routes

permissions:
  actions: write
  contents: read

jobs:
  encoded-mime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare repository-shaped JSON samples
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          for name in ("carrier-percent-85.json", "carrier-percent-1c.json"):
              payload = {
                  "full_name": "pending/pending",
                  "owner": {"login": "cassette", "avatar_url": "file:///proc/self/environ"},
                  "description": "Repo Cassette encoded MIME probe",
                  "stargazers_count": 0,
              }
              with open(name, "wb") as stream:
                  stream.write(json.dumps(payload, separators=(",", ":")).encode())
          PY
      - name: Upload MIME token with encoded NEL
        id: percent85
        continue-on-error: true
        uses: ./.github/actions/raw-artifact
        with:
          path: carrier-percent-85.json
          version: "7"
          mime_type: "application/json%85"
          blob_mime_type: "application/json%85"
      - name: Upload MIME token with encoded FS
        id: percent1c
        continue-on-error: true
        uses: ./.github/actions/raw-artifact
        with:
          path: carrier-percent-1c.json
          version: "7"
          mime_type: "application/json%1c"
          blob_mime_type: "application/json%1c"
      - name: Inspect the resulting response headers
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const https = require('https');
            const {owner, repo} = context.repo;
            const artifacts = await github.rest.actions.listArtifactsForRepo({owner, repo, per_page: 100});
            const selected = artifacts.data.artifacts.filter(a =>
              a.workflow_run?.id === context.runId &&
              ['carrier-percent-85.json', 'carrier-percent-1c.json'].includes(a.name));
            function get(url, headers) {
              return new Promise((resolve, reject) => https.get(url, {headers}, response => {
                const chunks = [];
                response.on('data', c => chunks.push(c));
                response.on('end', () => resolve({
                  status: response.statusCode || 0,
                  headers: response.headers,
                  body: Buffer.concat(chunks),
                }));
              }).on('error', reject));
            }
            for (const artifact of selected) {
              const api = new URL('https://api.github.com/repos/' + owner + '/' + repo +
                '/actions/artifacts/' + artifact.id + '/zip');
              let current = api;
              let response;
              for (let hop = 0; hop < 5; hop++) {
                response = await get(current, {
                  accept: 'application/vnd.github.v3+json',
                  authorization: 'Bearer ' + process.env.GITHUB_TOKEN,
                  'user-agent': 'repo-cassette-probe',
                  'x-github-api-version': '2022-11-28',
                });
                if (response.status >= 300 && response.status < 400 && response.headers.location) {
                  current = new URL(response.headers.location, current);
                  continue;
                }
                break;
              }
              const type = String(response.headers['content-type'] || '');
              console.log('MIME_ARTIFACT=' + artifact.name + ' ID=' + artifact.id);
              console.log('MIME_STATUS=' + response.status);
              console.log('MIME_CT=' + JSON.stringify(type));
              console.log('MIME_CT_CODES=' + Array.from(type, c => c.codePointAt(0).toString(16)).join(','));
              console.log('MIME_BYTES=' + response.body.length);
            }
            console.log('MIME_SUCCESS_COUNT=' + selected.length);
      - name: Remove probe artifacts from this branch
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const {owner, repo} = context.repo;
            const result = await github.rest.actions.listArtifactsForRepo({owner, repo, per_page: 100});
            const probeArtifacts = result.data.artifacts.filter(a =>
              a.workflow_run?.head_branch === 'codex/repo-cassette-release-routes');
            for (const artifact of probeArtifacts) {
              await github.rest.actions.deleteArtifact({owner, repo, artifact_id: artifact.id});
            }
            console.log('PROBE_ARTIFACTS_DELETED=' + probeArtifacts.length);
