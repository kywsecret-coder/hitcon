name: Repo Cassette NEL artifact metadata probe

on:
  push:
    branches: [codex/repo-cassette-carrier]

permissions:
  actions: read
  contents: read

jobs:
  carrier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare repository-shaped JSON
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          payload = {
              "full_name": "pending/pending",
              "owner": {"login": "cassette", "avatar_url": "file:///proc/self/environ"},
              "description": "Repo Cassette NEL metadata probe",
              "stargazers_count": 0,
          }
          with open("carrier.json", "wb") as stream:
              stream.write(json.dumps(payload, separators=(",", ":")).encode())
          PY
      - name: Create raw artifact with NEL JSON MIME
        id: carrier
        uses: ./.github/actions/raw-artifact
        with:
          path: carrier.json
          mime_type: "application/json\\N"
          blob_mime_type: "application/json\\N"
      - name: Report artifact ID
        env:
          ARTIFACT_ID: ${{ steps.carrier.outputs.artifact-id }}
        run: printf 'ARTIFACT_ID=%s\\n' "$ARTIFACT_ID"
