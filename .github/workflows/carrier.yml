name: Repo Cassette leading NEL MIME probe

on:
  push:
    branches:
      - codex/repo-cassette-release-routes

permissions:
  actions: write
  contents: read

jobs:
  artifact-v7:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare repository-shaped JSON
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          payload = {
              "full_name": "pending/pending",
              "owner": {"login": "cassette", "avatar_url": "file:///proc/self/environ"},
              "description": "Repo Cassette leading NEL MIME probe",
              "stargazers_count": 0,
          }
          with open("carrier-prefix-nel.json", "wb") as stream:
              stream.write(json.dumps(payload, separators=(",", ":")).encode())
          PY
      - name: Upload v7 artifact with leading NEL MIME
        id: carrier
        continue-on-error: true
        uses: ./.github/actions/raw-artifact
        with:
          path: carrier-prefix-nel.json
          version: "7"
          mime_type: "\u0085application/json"
          blob_mime_type: "\u0085application/json"
      - name: Inspect raw artifact response
        if: steps.carrier.outputs.artifact-id != ''
        uses: actions/github-script@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT_ID: ${{ steps.carrier.outputs.artifact-id }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const https = require('https');
            const {createHash} = require('crypto');
            const id = process.env.ARTIFACT_ID;
            const target = new URL('https://api.github.com/repos/' + context.repo.owner + '/' +
              context.repo.repo + '/actions/artifacts/' + id + '/zip');
            function request(url, headers) {
              return new Promise((resolve, reject) => {
                https.get(url, {headers}, response => {
                  const chunks = [];
                  for (const [key, value] of Object.entries(response.headers)) {
                    if (key.toLowerCase() === 'content-type') {
                      const cps = Array.from(String(value), c => c.codePointAt(0).toString(16));
                      console.log('RAW_CT=' + JSON.stringify(value));
                      console.log('RAW_CT_CODES=' + cps.join(','));
                    }
                  }
                  response.on('data', chunk => chunks.push(chunk));
                  response.on('end', () => resolve({
                    status: response.statusCode || 0,
                    headers: response.headers,
                    body: Buffer.concat(chunks),
                  }));
                }).on('error', reject);
              });
            }
            let response;
            let current = target;
            for (let hop = 0; hop < 6; hop++) {
              const headers = {
                accept: 'application/vnd.github.v3+json',
                'user-agent': 'repo-cassette-probe',
                'x-github-api-version': '2022-11-28',
              };
              if (current.hostname === 'api.github.com') {
                headers.authorization = 'Bearer ' + process.env.GITHUB_TOKEN;
              }
              response = await request(current, headers);
              if (response.status >= 300 && response.status < 400 && response.headers.location) {
                current = new URL(response.headers.location, current);
                continue;
              }
              break;
            }
            console.log('ARTIFACT_ID=' + id);
            console.log('HTTP_STATUS=' + response.status + ' HOST=' + current.host);
            console.log('BYTES=' + response.body.length);
            console.log('SHA256=' + createHash('sha256').update(response.body).digest('hex'));
      - name: Remove probe artifacts from this branch
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const {owner, repo} = context.repo;
            const result = await github.rest.actions.listArtifactsForRepo({owner, repo, per_page: 100});
            const probeArtifacts = result.data.artifacts.filter(a =>
              a.workflow_run?.head_branch === 'codex/repo-cassette-release-routes');
            for (const artifact of probeArtifacts) {
              await github.rest.actions.deleteArtifact({owner, repo, artifact_id: artifact.id});
            }
            console.log('PROBE_ARTIFACTS_DELETED=' + probeArtifacts.length);
