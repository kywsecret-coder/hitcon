name: Repo Cassette carrier

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read

jobs:
  carrier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the archived repository-shaped JSON
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          payload = {
              "full_name": "cassette/raw-payload",
              "owner": {
                  "login": "cassette",
                  "avatar_url": "file:///proc/self/environ",
              },
              "description": "Repo Cassette nested protobuf candidate",
              "stargazers_count": 0,
          }
          with open("carrier.json", "wb") as stream:
              stream.write(json.dumps(payload, separators=(",", ":")).encode())
          PY
      - name: Upload raw JSON with a leading-NEL artifact MIME
        id: carrier
        uses: ./.github/actions/raw-artifact
        with:
          path: carrier.json
      - name: Print artifact identifier
        env:
          ARTIFACT_ID: ${{ steps.carrier.outputs.artifact-id }}
        run: printf 'ARTIFACT_ID=%s\n' "$ARTIFACT_ID"
      - name: Inspect the public artifact response headers
        env:
          ARTIFACT_ID: ${{ steps.carrier.outputs.artifact-id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import { createHash } from 'node:crypto';
          const url = 'https://api.github.com/repos/' + process.env.GITHUB_REPOSITORY +
            '/actions/artifacts/' + process.env.ARTIFACT_ID + '/zip';
          const queries = [
            ['default', ''],
            ['raw', '?raw=1'],
            ['download', '?download=1'],
            ['response-content-type', '?response-content-type=application%2Fjson%C2%85'],
            ['rsct', '?rsct=application%2Fjson%C2%85'],
          ];
          for (const [label, query] of queries) {
            const response = await fetch(url + query, {
              headers: {
                accept: 'application/vnd.github.v3+json',
                authorization: 'Bearer ' + process.env.GH_TOKEN,
              },
            });
            const contentType = response.headers.get('content-type') || '';
            const bytes = Buffer.from(await response.arrayBuffer());
            let payload;
            try { payload = JSON.parse(bytes.toString('utf8')); } catch {}
            console.log(label + '_STATUS=' + response.status);
            console.log(label + '_CONTENT_TYPE=' + JSON.stringify(contentType));
            console.log(label + '_CONTENT_TYPE_CODEPOINTS=' +
              Array.from(contentType, c => c.codePointAt(0).toString(16)).join(','));
            console.log(label + '_BODY_BYTES=' + bytes.length);
            console.log(label + '_BODY_SHA256=' + createHash('sha256').update(bytes).digest('hex'));
            console.log(label + '_BODY_FULL_NAME=' + (payload?.full_name || ''));
          }
          JS
