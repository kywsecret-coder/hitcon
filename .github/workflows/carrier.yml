name: Repo Cassette artifact blob MIME fallback probe

on:
  push:
    branches:
      - codex/repo-cassette-release-routes

permissions:
  actions: read
  contents: read

jobs:
  artifact-blob-mime-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare repository-shaped JSON
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          payload = {
              "full_name": "pending/pending",
              "owner": {"login": "cassette", "avatar_url": "file:///proc/self/environ"},
              "description": "Repo Cassette artifact MIME fallback probe",
              "stargazers_count": 0,
          }
          with open("carrier.json", "wb") as stream:
              stream.write(json.dumps(payload, separators=(",", ":")).encode())
          PY
      - name: Upload raw artifact without MIME metadata
        id: carrier
        uses: ./.github/actions/raw-artifact
        with:
          path: carrier.json
          version: "6"
          blob_mime_type: "application/json\u0085"
      - name: Inspect the artifact API response
        uses: actions/github-script@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT_ID: ${{ steps.carrier.outputs.artifact-id }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const https = require('https');
            const {createHash} = require('crypto');
            const id = process.env.ARTIFACT_ID;
            const url = 'https://api.github.com/repos/' + context.repo.owner + '/' +
              context.repo.repo + '/actions/artifacts/' + id + '/zip';
            function request(target, headers) {
              return new Promise((resolve, reject) => {
                https.get(target, {headers}, response => {
                  const chunks = [];
                  response.on('data', chunk => chunks.push(chunk));
                  response.on('end', () => resolve({
                    status: response.statusCode || 0,
                    headers: response.headers,
                    body: Buffer.concat(chunks),
                  }));
                }).on('error', reject);
              });
            }
            let current = new URL(url);
            let response;
            for (let hop = 0; hop < 6; hop++) {
              const headers = {
                accept: 'application/vnd.github.v3+json',
                'user-agent': 'repo-cassette-probe',
                'x-github-api-version': '2022-11-28',
              };
              if (current.hostname === 'api.github.com') {
                headers.authorization = 'Bearer ' + process.env.GITHUB_TOKEN;
              }
              response = await request(current, headers);
              if (response.status >= 300 && response.status < 400 && response.headers.location) {
                current = new URL(response.headers.location, current);
                continue;
              }
              break;
            }
            const type = response.headers['content-type'] || '';
            console.log('ARTIFACT_ID=' + id);
            console.log('ARTIFACT_RESPONSE_STATUS=' + response.status);
            console.log('ARTIFACT_RESPONSE_HOST=' + current.host);
            console.log('ARTIFACT_RESPONSE_CONTENT_TYPE=' + JSON.stringify(type));
            console.log('ARTIFACT_RESPONSE_BYTES=' + response.body.length);
            console.log('ARTIFACT_RESPONSE_SHA256=' + createHash('sha256').update(response.body).digest('hex'));
            console.log('ARTIFACT_RESPONSE_PREFIX_HEX=' + response.body.subarray(0, 32).toString('hex'));
            try {
              const body = JSON.parse(response.body.toString('utf8'));
              console.log('ARTIFACT_RESPONSE_FULL_NAME=' + JSON.stringify(body.full_name));
              console.log('ARTIFACT_RESPONSE_AVATAR=' + JSON.stringify(body.owner?.avatar_url));
            } catch {
              console.log('ARTIFACT_RESPONSE_JSON=false');
            }
