name: Repo Cassette legacy signed MIME probe

on:
  push:
    branches:
      - codex/repo-cassette-release-routes

permissions:
  actions: write
  contents: read

jobs:
  signed-v6:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare repository-shaped JSON
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          payload = {
              "full_name": "pending/pending",
              "owner": {"login": "cassette", "avatar_url": "file:///proc/self/environ"},
              "description": "Repo Cassette v6 legacy MIME probe",
              "stargazers_count": 0,
          }
          with open("carrier-v6.json", "wb") as stream:
              stream.write(json.dumps(payload, separators=(",", ":")).encode())
          PY
      - name: Upload version 6 artifact with NEL MIME
        uses: ./.github/actions/raw-artifact
        with:
          path: carrier-v6.json
          version: "6"
          mime_type: "application/json\u0085"
          blob_mime_type: "application/json\u0085"
      - name: Inspect legacy signed URL and REST response
        env:
          ACTIONS_RESULTS_URL: ${{ env.ACTIONS_RESULTS_URL }}
          ACTIONS_RUNTIME_TOKEN: ${{ env.ACTIONS_RUNTIME_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const https = require('https');
            const {owner, repo} = context.repo;
            const data = await github.rest.actions.listArtifactsForRepo({owner, repo, per_page: 100});
            const artifact = data.data.artifacts.find(a =>
              a.workflow_run?.id === context.runId && a.name === 'carrier-v6.json');
            if (!artifact) throw new Error('probe artifact missing');
            const claims = JSON.parse(Buffer.from(process.env.ACTIONS_RUNTIME_TOKEN.split('.')[1], 'base64url').toString('utf8'));
            const scope = String(claims.scp || '').split(' ').find(x => x.startsWith('Actions.Results:'));
            const [, runId, jobId] = scope.split(':');
            const rpcUrl = new URL('/twirp/github.actions.results.api.v1.ArtifactService/GetSignedArtifactURL',
              new URL(process.env.ACTIONS_RESULTS_URL).origin);
            const signedResponse = await fetch(rpcUrl, {
              method: 'POST',
              headers: {
                authorization: 'Bearer ' + process.env.ACTIONS_RUNTIME_TOKEN,
                'content-type': 'application/json',
              },
              body: JSON.stringify({
                workflow_run_backend_id: runId,
                workflow_job_run_backend_id: jobId,
                name: 'carrier-v6.json',
              }),
            });
            const signed = await signedResponse.json();
            if (!signed.signed_url) throw new Error('signed URL unavailable');
            function get(url, headers) {
              return new Promise((resolve, reject) => https.get(url, {headers}, r => {
                const chunks = [];
                r.on('data', c => chunks.push(c));
                r.on('end', () => resolve({
                  status: r.statusCode || 0,
                  headers: r.headers,
                  body: Buffer.concat(chunks),
                }));
              }).on('error', reject));
            }
            const directUrl = new URL(signed.signed_url);
            const direct = await get(directUrl, {});
            const directType = String(direct.headers['content-type'] || '');
            console.log('V6_ID=' + artifact.id);
            console.log('V6_DIRECT_STATUS=' + direct.status);
            console.log('V6_DIRECT_HOST=' + directUrl.host);
            console.log('V6_DIRECT_CT=' + JSON.stringify(directType));
            console.log('V6_DIRECT_CT_CODES=' + Array.from(directType, c => c.codePointAt(0).toString(16)).join(','));
            console.log('V6_DIRECT_BYTES=' + direct.body.length);
            const apiUrl = new URL('https://api.github.com/repos/' + owner + '/' + repo +
              '/actions/artifacts/' + artifact.id + '/zip');
            let current = apiUrl;
            let final;
            let first;
            for (let hop = 0; hop < 5; hop++) {
              const headers = {
                accept: 'application/vnd.github.v3+json',
                authorization: 'Bearer ' + process.env.GITHUB_TOKEN,
                'user-agent': 'repo-cassette-probe',
                'x-github-api-version': '2022-11-28',
              };
              final = await get(current, headers);
              if (hop === 0) first = final;
              if (final.status >= 300 && final.status < 400 && final.headers.location) {
                current = new URL(final.headers.location, current);
                continue;
              }
              break;
            }
            const type = String(final.headers['content-type'] || '');
            console.log('V6_REST_STATUS=' + final.status);
            console.log('V6_REST_CT=' + JSON.stringify(type));
            console.log('V6_REST_CT_CODES=' + Array.from(type, c => c.codePointAt(0).toString(16)).join(','));
            console.log('V6_REST_BYTES=' + final.body.length);
      - name: Remove probe artifacts from this branch
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const {owner, repo} = context.repo;
            const result = await github.rest.actions.listArtifactsForRepo({owner, repo, per_page: 100});
            const probeArtifacts = result.data.artifacts.filter(a =>
              a.workflow_run?.head_branch === 'codex/repo-cassette-release-routes');
            for (const artifact of probeArtifacts) {
              await github.rest.actions.deleteArtifact({owner, repo, artifact_id: artifact.id});
            }
            console.log('PROBE_ARTIFACTS_DELETED=' + probeArtifacts.length);
