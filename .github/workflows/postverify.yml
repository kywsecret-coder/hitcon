name: Probe step-log REST permissions

on:
  push:
    branches:
      - codex/repo-cassette-release-routes

permissions:
  actions: write
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Compare GitHub Actions log endpoints
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import https from 'node:https';
          const repository = process.env.GITHUB_REPOSITORY;
          const jobId = '121121504702';
          function request(url, apiVersion) {
            return new Promise((resolve, reject) => {
              const req = https.get(url, {headers: {
                authorization: 'Bearer ' + process.env.GITHUB_TOKEN,
                accept: 'application/vnd.github+json',
                'x-github-api-version': apiVersion,
                'user-agent': 'repo-cassette-step-log-permission-probe',
              }}, response => {
                const chunks = [];
                response.on('data', chunk => chunks.push(chunk));
                response.on('end', () => resolve({
                  status: response.statusCode,
                  headers: response.headers,
                  body: Buffer.concat(chunks),
                }));
              });
              req.on('error', reject);
              req.setTimeout(20000, () => req.destroy(new Error('request timeout')));
            });
          }
          const base = 'https://api.github.com/repos/' + repository + '/actions/jobs/' + jobId;
          const results = [];
          for (const [label, suffix, version] of [
            ['job', '', '2026-03-10'],
            ['joblogs', '/logs', '2026-03-10'],
            ['step0', '/steps/0/logs', '2026-03-10'],
            ['step2', '/steps/2/logs', '2026-03-10'],
            ['step2-oldapi', '/steps/2/logs', '2022-11-28'],
          ]) {
            const api = await request(base + suffix, version);
            let final = api;
            if (api.status === 302 && api.headers.location) {
              const res = await new Promise((resolve, reject) => {
                const req = https.get(api.headers.location, response => {
                  const chunks = [];
                  response.on('data', chunk => chunks.push(chunk));
                  response.on('end', () => resolve({
                    status: response.statusCode,
                    headers: response.headers,
                    body: Buffer.concat(chunks),
                  }));
                });
                req.on('error', reject);
                req.setTimeout(20000, () => req.destroy(new Error('request timeout')));
              });
              final = res;
            }
            results.push({
              label,
              apiStatus: api.status,
              finalStatus: final.status,
              contentType: final.headers['content-type'] || '',
              bytes: final.body.length,
            });
          }
          console.log('ACTIONS-LOG-ROUTE-PROBE', JSON.stringify(results));
          NODE
