name: Probe step-log REST indices

on:
  push:
    branches:
      - codex/repo-cassette-release-routes

permissions:
  actions: write
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe step-log index mapping
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import https from 'node:https';
          const repository = process.env.GITHUB_REPOSITORY;
          const jobId = '121121504702';
          const headers = {
            authorization: 'Bearer ' + process.env.GITHUB_TOKEN,
            accept: 'application/vnd.github+json',
            'x-github-api-version': '2026-03-10',
            'user-agent': 'repo-cassette-step-index-probe',
          };
          function request(url, requestHeaders = {}) {
            return new Promise((resolve, reject) => {
              const req = https.get(url, {headers: requestHeaders}, response => {
                const chunks = [];
                response.on('data', chunk => chunks.push(chunk));
                response.on('end', () => resolve({
                  status: response.statusCode,
                  headers: response.headers,
                  body: Buffer.concat(chunks),
                }));
              });
              req.on('error', reject);
              req.setTimeout(20000, () => req.destroy(new Error('request timeout')));
            });
          }
          const results = [];
          for (let index = 0; index <= 8; index++) {
            const api = await request(
              'https://api.github.com/repos/' + repository + '/actions/jobs/' + jobId + '/steps/' + index + '/logs',
              headers,
            );
            let final = api;
            if (api.status === 302 && api.headers.location) final = await request(api.headers.location);
            results.push({
              index,
              status: api.status,
              finalStatus: final.status,
              contentType: final.headers['content-type'] || '',
              bytes: final.body.length,
            });
          }
          console.log('STEP-INDEX-PROBE', JSON.stringify(results));
          NODE
