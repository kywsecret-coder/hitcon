name: Compare step-log public and read access

on:
  push:
    branches:
      - codex/repo-cassette-release-routes

permissions:
  actions: read
  contents: none

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Compare step log access modes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import https from 'node:https';
          const repository = process.env.GITHUB_REPOSITORY;
          const currentRunId = Number(process.env.GITHUB_RUN_ID);
          function request(url, auth) {
            return new Promise((resolve, reject) => {
              const headers = {
                accept: 'application/vnd.github+json',
                'x-github-api-version': '2026-03-10',
                'user-agent': 'repo-cassette-step-log-access-probe',
              };
              if (auth) headers.authorization = 'Bearer ' + process.env.GITHUB_TOKEN;
              const req = https.get(url, {headers}, response => {
                const chunks = [];
                response.on('data', chunk => chunks.push(chunk));
                response.on('end', () => resolve({
                  status: response.statusCode,
                  requestId: response.headers['x-github-request-id'] || '',
                  type: response.headers['content-type'] || '',
                  body: Buffer.concat(chunks).toString('utf8'),
                }));
              });
              req.on('error', reject);
              req.setTimeout(20000, () => req.destroy(new Error('request timeout')));
            });
          }
          const list = await request(
            'https://api.github.com/repos/' + repository +
              '/actions/runs?branch=codex%2Frepo-cassette-release-routes&per_page=100',
            true,
          );
          if (list.status !== 200) throw new Error('run lookup ' + list.status);
          const runs = JSON.parse(list.body).workflow_runs;
          const run = runs.filter(x =>
            x.name === 'Build Repo Cassette step-log carrier' &&
            Number(x.id) < currentRunId && x.status === 'completed'
          ).sort((a,b) => Number(b.id)-Number(a.id))[0];
          if (!run) throw new Error('no completed carrier run');
          const jobs = await request(
            'https://api.github.com/repos/' + repository +
              '/actions/runs/' + run.id + '/jobs?filter=latest',
            true,
          );
          if (jobs.status !== 200) throw new Error('job lookup ' + jobs.status);
          const carrier = JSON.parse(jobs.body).jobs.find(x => x.name === 'carrier');
          if (!carrier) throw new Error('carrier job missing');
          const base = 'https://api.github.com/repos/' + repository +
            '/actions/jobs/' + carrier.id + '/steps/';
          const results = [];
          for (const [index, auth] of [[1,true],[2,true],[1,false],[2,false]]) {
            results.push({index, auth, ...(await request(base + index + '/logs', auth))});
          }
          console.log('STEP-LOG-ACCESS-CHECK', JSON.stringify({
            priorRun: run.id, job: carrier.id, results,
          }));
          NODE
