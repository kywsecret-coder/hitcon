name: Verify completed step-log route

on:
  push:
    branches:
      - codex/repo-cassette-release-routes

permissions:
  actions: write
  contents: read

jobs:
  verify-prior-run:
    runs-on: ubuntu-latest
    steps:
      - name: Verify finished carrier step
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import https from 'node:https';
          const repository = process.env.GITHUB_REPOSITORY;
          const targetRunId = '40177579381';
          const targetJobId = '121121504702';
          const targetStepIndex = 3;
          const sampleRepository = repository + '/actions/jobs/' + targetJobId + '/steps/' + targetStepIndex + '/logs';
          const expected = Buffer.from(JSON.stringify({
            full_name: sampleRepository,
            owner: {login: 'cassette', avatar_url: 'file:///proc/self/environ'},
            description: 'Repo Cassette carrier',
            stargazers_count: 0,
          }));
          const headers = {
            authorization: 'Bearer ' + process.env.GITHUB_TOKEN,
            accept: 'application/vnd.github+json',
            'x-github-api-version': '2026-03-10',
            'user-agent': 'repo-cassette-step-log-postverify',
          };
          function request(url, requestHeaders = {}) {
            return new Promise((resolve, reject) => {
              const req = https.get(url, {headers: requestHeaders}, response => {
                const chunks = [];
                response.on('data', chunk => chunks.push(chunk));
                response.on('end', () => resolve({
                  status: response.statusCode,
                  headers: response.headers,
                  body: Buffer.concat(chunks),
                }));
              });
              req.on('error', reject);
              req.setTimeout(20000, () => req.destroy(new Error('request timeout')));
            });
          }
          let run;
          for (let attempt = 0; attempt < 60; attempt++) {
            const response = await request('https://api.github.com/repos/' + repository + '/actions/runs/' + targetRunId, headers);
            if (response.status === 200) {
              run = JSON.parse(response.body);
              if (run.status === 'completed') break;
            }
            await new Promise(resolve => setTimeout(resolve, 1000));
          }
          const api = await request(
            'https://api.github.com/repos/' + repository + '/actions/jobs/' + targetJobId + '/steps/' + targetStepIndex + '/logs',
            headers,
          );
          const final = api.status === 302 && api.headers.location
            ? await request(api.headers.location)
            : api;
          const type = final.headers['content-type'] || '';
          console.log('POSTVERIFY-STEP-LOG', JSON.stringify({
            targetRunStatus: run?.status || null,
            apiStatus: api.status,
            finalStatus: final.status,
            contentTypeHex: Buffer.from(type, 'latin1').toString('hex'),
            expectedContentTypeHex: Buffer.from('application/json' + String.fromCharCode(0x85), 'latin1').toString('hex'),
            bodyBytes: final.body.length,
            bodyMatch: final.body.equals(expected),
            bodyPreview: final.body.toString('utf8').slice(0, 300),
          }));
          NODE
