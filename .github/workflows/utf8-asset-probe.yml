name: Repo Cassette asset response header check

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/utf8-asset-probe.yml

permissions:
  contents: write

jobs:
  inspect-and-clean:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect stored NEL metadata, then clean temporary resources
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          node <<'NODE'
          const { URL } = require('node:url');

          async function main() {
            const repo = process.env.GITHUB_REPOSITORY;
            const token = process.env.GH_TOKEN;
            const assetId = 674615212;
            const releaseId = 423287205;
            const tag = 'codex-rctf-utf8-asset-probe-20261025-b';
            const branch = 'codex/repo-cassette-utf8-asset-probe';
            const result = { repo, assetId, releaseId };

            function cps(value) {
              return Array.from(value || '', ch => 'U+' + ch.codePointAt(0).toString(16).toUpperCase().padStart(4, '0'));
            }

            async function api(path, method = 'GET', accept = 'application/vnd.github.v3+json', body) {
              const response = await fetch('https://api.github.com' + path, {
                method,
                headers: {
                  authorization: 'Bearer ' + token,
                  accept,
                  'x-github-api-version': '2022-11-28',
                  'user-agent': 'repo-cassette-header-check',
                  ...(body ? { 'content-type': 'application/json' } : {}),
                },
                ...(body ? { body: JSON.stringify(body) } : {}),
              });
              const bytes = Buffer.from(await response.arrayBuffer());
              const text = bytes.toString('utf8');
              let data = null;
              try { data = JSON.parse(text); } catch {}
              return { response, bytes, text, data };
            }

            const metadata = await api('/repos/' + repo + '/releases/assets/' + assetId);
            result.metadata_status = metadata.response.status;
            result.metadata_http_content_type = metadata.response.headers.get('content-type');
            result.metadata_http_content_type_codepoints = cps(result.metadata_http_content_type);
            result.asset_metadata_content_type = metadata.data && metadata.data.content_type;
            result.asset_metadata_content_type_codepoints = cps(result.asset_metadata_content_type);

            const raw = await api('/repos/' + repo + '/releases/assets/' + assetId, 'GET', 'application/octet-stream');
            result.raw_status = raw.response.status;
            result.raw_final_url_host = new URL(raw.response.url).host;
            result.raw_http_content_type = raw.response.headers.get('content-type');
            result.raw_http_content_type_codepoints = cps(result.raw_http_content_type);
            result.raw_body_bytes = raw.bytes.length;
            result.raw_body_sha256 = require('node:crypto').createHash('sha256').update(raw.bytes).digest('hex');

            const releaseDeleted = await api('/repos/' + repo + '/releases/' + releaseId, 'DELETE');
            result.delete_release_status = releaseDeleted.response.status;
            const tagDeleted = await api('/repos/' + repo + '/git/refs/tags/' + tag, 'DELETE');
            result.delete_tag_status = tagDeleted.response.status;
            const branchDeleted = await api('/repos/' + repo + '/git/refs/heads/' + branch, 'DELETE');
            result.delete_probe_branch_status = branchDeleted.response.status;

            const path = '/repos/' + repo + '/contents/utf8-asset-header-check.json';
            const saved = await api(path, 'PUT', 'application/vnd.github.v3+json', {
              message: 'record temporary Repo Cassette asset header check',
              branch: 'main',
              content: Buffer.from(JSON.stringify(result, null, 2)).toString('base64'),
            });
            result.result_write_status = saved.response.status;
            if (!saved.response.ok) throw new Error('result write failed: ' + saved.text.slice(0, 300));
            console.log(JSON.stringify(result));
          }

          main().catch(error => { console.error(error); process.exitCode = 1; });
          NODE